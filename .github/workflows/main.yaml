name: GitHub Actions

on:
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * *'
  pull_request:
    paths:
      - '.github/workflows/main.yaml'
      - '*.py'
      - 'main.sh'
      - 'requirements.txt'

permissions:
  contents: read

jobs:
  ddy:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: ${{ github.event_name != 'pull_request' && github.ref_type == 'branch' }}
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Working
        timeout-minutes: 360
        run: bash ./main.sh
      - name: Commit and push changes
        if: github.event_name != 'pull_request' && github.ref_type == 'branch'
        run: |
          git config --local user.email "8297757+rehiy@users.noreply.github.com"
          git config --local user.name "Sea"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "⌚️$(date +%Y%m%d%H%M%S)"
          git push origin "HEAD:${GITHUB_REF}"
